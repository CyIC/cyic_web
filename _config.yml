# ---------------------------------------------------------------------------
# Cypress Investment Club - cyic.club
# Built by Jekyll natively on GitHub Pages (no Actions workflow required).
# Tailwind is compiled locally with `npm run css`; the output css/tailwind.css
# is committed so the native Pages build has nothing to compile.
# ---------------------------------------------------------------------------

title: Cypress Investment Club
short_title: CyIC
tagline: Profit through combined intellect, research, and capital.
email: web@cyic.club
description: >-
  Cypress Investment Club is a member-run partnership in which people pool
  modest monthly contributions, research companies together, and vote on every
  investment the club makes.
lang: en

url: "https://cyic.club"
baseurl: ""

twitter_username: cypressinvclub
github_username: CyIC

# Every outbound destination in one place so templates never hardcode a URL.
links:
  discord: "https://discord.gg/FStB5tqxBR"
  wiki: "https://thecyic.atlassian.net/wiki"
  youtube: "https://www.youtube.com/channel/UCUhhBb8XqV7Xw5PRDVFRXkA"
  myiclub: "https://www.myiclub.com"
  github: "https://github.com/CyIC"
  twitter: "https://twitter.com/cypressinvclub"
  documents: "https://github.com/CyIC/documents"
  bylaws: "https://github.com/CyIC/documents/blob/main/CyICBylaws"
  sec_clubs: "https://www.sec.gov/reportspubs/investor-publications/investor-pubs-invclub"

# Club facts referenced across pages. Changing one here updates every mention.
club:
  objective_multiple: "100%"
  objective_years: "5 years"
  target_cagr: "14.9%"
  minimum_monthly: "$10"
  member_cap: 20
  meeting_cadence: "Second Friday of the month"
  meetings_to_apply: 2

markdown: kramdown

# Setting `exclude` REPLACES Jekyll's default list rather than extending it,
# so the vendor/ entries below have to be restated. Without them a CI run that
# bundles into vendor/bundle inside the workspace makes Jekyll try to render
# its own gem's post template, which has an ERB placeholder where its date
# should be, and the build dies.
exclude:
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - node_modules
  - src
  - script
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENCE
  - .gitlab
  - .idea
  - .github
