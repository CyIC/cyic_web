# FAQ content. Answers may contain inline HTML; they are rendered unescaped.
# Substance preserved from the original faq.html, copy tightened.

- section: Membership
  id: joining
  questions:
    - q: Is membership open to the public?
      a: >-
        No. Cypress Investment Club is a private club. It does not advertise or
        solicit membership, it does not accept unsolicited applications, and
        nothing on this site is an offer to sell or a solicitation of an offer
        to buy an interest in the club or any security. Investment clubs rely
        on an exclusion that is available only to a club that makes no public
        offering of its interests, so this is a constraint the club has to keep
        to rather than a matter of preference.
    - q: How does the club admit a new partner?
      a: >-
        A prospective partner sits in on at least two meetings, then submits a
        completed stock checklist on a company of their choosing and presents
        it. The existing partners vote, and acceptance has to be unanimous.
        Membership is capped at twenty.
    - q: Why publish any of this if the club is not open?
      a: >-
        Because a club that asks its partners to read filings should be willing
        to have its own paperwork read. The governing documents are public, the
        procedure is public, and this site is a plainer retelling of both. None
        of that is an invitation.
    - q: What minimum amount does a partner contribute each month?
      a: >-
        Ten dollars a month, as set by the partnership agreement. The floor is
        deliberately low, and hardship exceptions can be arranged.
    - q: Are there fees to join or to withdraw funds?
      a: >-
        No. The club does not charge to join, and it does not charge a partner
        to withdraw any or all of their funds. If a withdrawal incurs a cost
        from a vendor, the withdrawing partner covers that cost. Keeping
        expenses down is a standing priority, because every dollar of expense
        is a dollar not invested.
    - q: Do partners have to belong to BetterInvesting, NAIC, or a similar body?
      a: >-
        No. The club requires no third-party memberships. Those subscriptions
        are an expense, and we would rather commit that money to the portfolio.
    - q: How experienced are the partners?
      a: >-
        The range is wide, and that is the point. We are primarily an
        educational organisation. Nobody here is finished learning, and helping
        each other learn is part of the deal.
    - q: What does the club expect of a new partner?
      a: >-
        Asking questions and completing the onboarding training. Those are the
        two real obligations in the first few months.
    - q: What time commitment is expected?
      a: >-
        At least two hours a month in the meeting itself, plus time during the
        month to research new candidates and review assigned holdings. Every
        partner is required to take an active part; a club whose members are
        passive stops being a club. The club is not a licensed broker or
        wealth manager, and no partner is paid for advice.

- section: Meetings
  id: meetings
  questions:
    - q: How often do you meet?
      a: >-
        The second Friday of every month. Meetings occasionally move or get
        postponed depending on attendance.
    - q: Is there an agenda?
      a: >-
        Yes, published in advance on our
        <a href="https://thecyic.atlassian.net/wiki">team wiki</a> for members.
    - q: Do meetings start and end on time?
      a: >-
        Not reliably. We are working on it.
    - q: Do all members take part in choosing stocks?
      a: >-
        Yes, and participation is enforced. Under our
        <a href="https://github.com/CyIC/documents/blob/main/CyICBylaws">bylaws</a>,
        failing to keep up a partner&rsquo;s duties for three consecutive months
        is grounds for removal, which then takes a two-thirds majority of the
        remaining partners.
    - q: Does the club keep a written record of why it bought or sold?
      a: >-
        Yes. Members have access to the presentations and worksheets used in
        each discussion, archived alongside the minutes.

- section: Investment process
  id: process
  questions:
    - q: Does the club have a stock selection methodology?
      a: >-
        We look for growth companies capable of roughly 14.9% compounded annual
        appreciation, which is what doubling in five years requires. There is a
        standard worksheet that every candidate goes through, and a new partner is
        trained on it before being asked to present one. Beyond the worksheet,
        it comes down to making the argument to the other partners.
    - q: Is background material circulated before a purchase is proposed?
      a: >-
        Yes. The worksheet has to be completed and submitted before the meeting
        at which it is discussed.
    - q: Are presentations thorough? Are presenters prepared?
      a: >-
        Sometimes, and sometimes a presenter is sent away to come back with
        more. That is what an educational club looks like in practice, and
        nobody is embarrassed by it.
    - q: How are decisions made? Weighted or equal-share voting?
      a: >-
        Both, depending on the vote. In the room, and absent a motion to do
        otherwise, a vote carries by simple majority of the active partners,
        one vote each. Underneath that, the
        <a href="https://github.com/CyIC/documents/blob/main/CyICPartnershipAgreement">partnership agreement</a>
        is the governing document, and it has each partner participating in
        the management of the club in proportion to their capital account. So
        the equal-share vote is the working default, not the whole story.
    - q: Can one partner's vote outweigh mine?
      a: >-
        On a weighted retally, yes, in proportion to capital accounts. Any
        active partner may ask for a vote to be recounted on that basis; the
        request has to be made during the meeting at which the vote was taken,
        and approval may not be unreasonably withheld. Two things bound it: it
        has to be invoked deliberately rather than being how we decide by
        default, and no contribution may take a partner's capital account past
        twenty-five percent of the club's total, so nobody can carry a vote
        alone.
    - q: How does the club choose between competing stock proposals?
      a: >-
        By point-system ballot rather than a straight yes or no. Where two or
        more stocks are on the table, each partner ranks them, giving the most
        points to their first choice and one point fewer to each one after
        that. The tally is then confirmed by a voice vote.
    - q: Who is entitled to vote?
      a: >-
        Active partners. Staying active means keeping up the duties set out in
        the <a href="https://github.com/CyIC/documents/blob/main/CyICBylaws">bylaws</a>,
        which include voting in at least two-thirds of club elections in any
        six-month period and keeping payments current &mdash; missing two
        consecutive monthly payments marks a partner inactive. Partners may
        also submit up to six proxies per calendar year.
    - q: Does the club diversify by size and industry?
      a: >-
        Yes. Diversification is one of the explicit criteria when a new holding
        is assessed. We aim to spread across sector, industry, and company size
        as laid out in our Investment Policy Statement.

- section: Money, records, and tax
  id: records
  questions:
    - q: Do members get meeting minutes promptly?
      a: >-
        Documents and minutes go up on the team site in near-real time.
    - q: Are the partnership and operating agreements public?
      a: >-
        Yes.
        <a href="https://github.com/CyIC/documents">All of them are published</a>
        and can be read right now, in full, by anyone.
    - q: Do members get monthly valuations and status reports?
      a: >-
        Yes, delivered to members before each meeting and archived so any
        member can review or audit them later.
    - q: Does the club use unit valuation accounting?
      a: >-
        Yes. Unit valuations and each member's ownership share are reported
        monthly.
    - q: Are the club's financial records reviewed annually?
      a: >-
        The financials are delivered to members every month rather than only at
        year end. We aim to operate as transparently as the accounting allows.
    - q: Are tax filings handled properly?
      a: >-
        Yes. As a partnership the club files Form 1065 annually and distributes
        K-1s to all partners through our platform.
    - q: Is the club subject to SEC regulation?
      a: >-
        The club is organised so that it does not have to register, and
        <a href="https://www.sec.gov/reportspubs/investor-publications/investor-pubs-invclub">the SEC&rsquo;s own guidance on investment clubs</a>
        sets out what that depends on. Two things matter most. Every partner
        has to take a genuine, active part in evaluating and voting on the
        club&rsquo;s holdings, because a club with passive members may be
        issuing securities. And the club must make no public offering of its
        interests, which is why it does not advertise or solicit membership.
        Both are reasons the club stays small, slow, and closed.

- section: Education
  id: education
  questions:
    - q: How does the club keep members learning?
      a: >-
        We maintain and keep extending an education plan alongside the
        portfolio work. It is a permanent work in progress, by design.
    - q: What will I actually learn?
      a: >-
        The basics first: how businesses make money, what a share is, how the
        market prices one. Where it goes from there depends on how far the
        members want to push it.
    - q: Is there a mentoring programme for new members?
      a: >-
        We are building one. Today it is informal, which mostly means any partner
        can ask any other partner anything.

- section: Governance
  id: governance
  questions:
    - q: Do officers change regularly?
      a: >-
        Yes. New officers are elected at the Annual Meeting in line with our
        <a href="https://github.com/CyIC/documents/blob/main/CyICBylaws">bylaws</a>.
