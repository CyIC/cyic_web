# The admission procedure, drawn from the bylaws and the partnership agreement.
#
# Deliberately written in the third person, as a record of how the club admits
# a partner rather than as an invitation to apply. An investment club relies on
# the private investment company exclusion under the Investment Company Act,
# which requires that it make no public offering of its interests, and a public
# website that solicits members can itself count as one. Keep this descriptive.
- step: "01"
  title: Two meetings first
  body: >-
    A prospective partner sits in on at least two meetings before any
    application, so nobody commits to a club they have not watched work.
- step: "02"
  title: A stock checklist
  body: >-
    An application is a completed worksheet on one company, researched and
    presented to the partners. The club trains them on the worksheet first.
- step: "03"
  title: Unanimous consent
  body: >-
    The existing partners vote, and acceptance has to be unanimous. Membership
    is capped at twenty so that every voice stays audible.
