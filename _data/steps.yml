# The membership path, drawn from the bylaws and the FAQ.
- step: "01"
  title: Join the conversation
  body: >-
    Say hello in our Discord. Ask anything. There is no cost and no obligation to
    go further.
- step: "02"
  title: Sit in on two meetings
  body: >-
    Prospective members attend at least two meetings before applying, so you
    see exactly how the club argues and decides.
- step: "03"
  title: Bring a stock checklist
  body: >-
    Apply by researching one company and presenting it on our standard
    worksheet. We will train you on it first.
- step: "04"
  title: Unanimous vote
  body: >-
    The partners vote. Acceptance is unanimous, and membership is capped at
    twenty so every voice stays audible.
