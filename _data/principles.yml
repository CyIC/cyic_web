# The four investing principles. Also summarised on the home page.
- title: Invest regularly, whatever the market is doing
  body: >-
    The hardest part of investing is starting, and the second hardest is
    continuing when the news is bad. Ten dollars a month invested on a schedule
    beats a larger sum that waits for the right moment. We contribute every
    month regardless of the outlook, because we cannot reliably tell a dip from
    the start of a decline, and neither can anyone else.
- title: Diversify to reduce risk
  body: >-
    No single company, sector, or company size carries the club. We spread
    holdings deliberately across industries and across small, mid, and large
    capitalisations, which both limits the damage any one mistake can do and
    widens the set of opportunities we are able to consider.
- title: Reinvest everything
  body: >-
    Dividends, earnings, and proceeds go straight back to work buying more
    shares. Compounding is the whole mechanism behind our objective, and cash
    sitting idle in an account is capital that has stopped compounding.
- title: Buy growth
  body: >-
    To double in five years we need roughly 14.9% compounded annually. That
    number is the filter every candidate passes through: we look for companies
    that can plausibly grow into it, and we are honest when one cannot. This is
    steady accumulation, not a sprint.
